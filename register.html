<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register — Beyond Sight</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="header">
    <div class="container nav">
      <a class="logo" href="index.html">Beyond Sight</a>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="post1.html">Articles</a></li>
        <li><a href="resources.html">Resources</a></li>
        <li><a href="login.html">Log In</a></li>
        <li><a href="register.html">Reg</a></li>
      </ul>
    </div>
  </header>
  <section class="hero">
    <div class="container">
      <h1>Create an account</h1>
      <p> Sign up to receive updates and access exclusive content.</p>
    </div>
  </section>
  <main class="container">
    <form id="register-form" class="form-card" novalidate>
      <label for="full-name">Full name</label>
      <input id="full-name" name="fullName" type="text" autocomplete="name">
      <p class="field-error" id="name-error"></p>

      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="email">
      <p class="field-error" id="email-error"></p>

      <label for="birthday">Birthday</label>
      <input id="birthday" name="birthday" type="date">
      <p class="field-error" id="birthday-error"></p>

      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="new-password">
      <p class="field-error" id="password-error"></p>

      <label for="confirm-password">Confirm password</label>
      <input id="confirm-password" name="confirmPassword" type="password" autocomplete="new-password">
      <p class="field-error" id="confirm-error"></p>

      <label for="topic">Favorite topic</label>
      <select id="topic" name="topic">
        <option value="">Choose a topic</option>
        <option>Accessibility tools</option>
        <option>Personal stories</option>
        <option>Technology</option>
      </select>
      <p class="field-error" id="topic-error"></p>

      <label><input id="consent" type="checkbox"> I agree to the privacy terms.</label>
      <p class="field-error" id="consent-error"></p>

      <button type="submit" class="btn">Create account</button>
      <p id="register-message" class="message" aria-live="polite" hidden></p>
      <p>Already registered? <a href="login.html">Login here</a>.</p>
    </form>
  </main>
  <footer class="footer">
    <div class="container">
      <p>Beyond Sight — a blog about low vision and accessibility.</p>
    </div>
  </footer>
  <script src="register.js"></script>
</body>
</html>
